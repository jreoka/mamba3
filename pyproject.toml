[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mamba3"
version = "0.2.0"
description = "A faithful, optimized PyTorch Mamba-3 mixer stack"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE", "NOTICE"]
authors = [{ name = "jreoka" }]
keywords = ["mamba", "state-space-model", "sequence-model", "pytorch", "cuda"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/jreoka/mamba3"
Repository = "https://github.com/jreoka/mamba3"
Issues = "https://github.com/jreoka/mamba3/issues"

[tool.setuptools.packages.find]
include = ["mamba3*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
  "ignore:AnnAssign.__init__ missing.*:DeprecationWarning:triton.compiler.code_generator",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mamba3"
version = "0.1.0"
description = "A compact selective state-space sequence model with fused CUDA kernels"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jreoka" }]
keywords = ["mamba", "state-space-model", "sequence-model", "pytorch", "cuda"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/jreoka/mamba3"
Repository = "https://github.com/jreoka/mamba3"
Issues = "https://github.com/jreoka/mamba3/issues"

[tool.setuptools.packages.find]
include = ["mamba3*"]

[tool.setuptools.package-data]
mamba3 = ["csrc/*.cpp", "csrc/*.cu"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
